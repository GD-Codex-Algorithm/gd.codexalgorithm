    <style>
        .container {
            display: flex;
            justify-content: space-between;
            align-items:flex-start;
            width: 100vw;
            max-width: 1200px;
            height: 100vh;
            margin: auto;
        }
        .buttons {
            width: 35%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 0px 10px 0px 10px;
            align-items: flex-end;
        }

        .images {
            width: 30%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .image-container {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.5;
        }
        .image-container.active {
            opacity: 1;
        }
        .image {
            width: 300px;
            height: 300px;
            margin: auto;
            display: none;
            image-rendering: pixelated;
            border-radius: 10px;
            border-style: solid;
            border-color: rgba(155, 155, 155, 0.8);
        }
        .image-container .last-active {
            display: block !important;
        }

        .dynamic-text {
            width: 35%;
            padding: 0px 10px 0px 10px;
            text-align: left;
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('.buttons button');
            const textElement = document.getElementById('dynamicText');
            const groups = document.querySelectorAll('.image-container');

            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    // Remove the 'active-button' class from all buttons
                    buttons.forEach(btn => btn.classList.remove('downloadButton-active'));

                    // Add the 'active-button' class to the clicked button
                    button.classList.add('downloadButton-active');
                });
            });

            const descriptions = {
                group0: "The algorithm structure forms the foundational framework of a system.<br>This variable can take 2 groups: Symbolic/classical structure or machine learning.<br> Symbolic or classical AI in video games refers to the use of predefined rules and logic to simulate intelligent behavior. In this approach, developers create explicit rules that dictate how the AI should behave in different scenarios.<br>Machine learning, on the other hand, enables computers to learn from data and improve their performance over time without being explicitly programmed. It uses algorithms to identify patterns and make decisions based on input data. Common applications include chatbots, self thought driving or cheat recognition.",
                group1: "The substructure of an algorithm is crucial in determining how the system's logic operates and how it is organized. It provides the blueprint for processing data and making decisions. This substructure can vary widely depending on its design and the specific goals of the system. For example, state machines model a system's behavior by defining different states and transitions based on conditions, while decision trees represent choices and their consequences in a tree-like form.<br>Behavior trees, commonly used in video game AI, offer a hierarchical way to control logic flow, allowing for modular and reusable code that manages complex behaviors. Rule-based systems rely on a set of if-then rules to draw conclusions or take actions, making them straightforward and easy to understand, especially in expert systems.<br>On the other hand, neural networks are inspired by the human brain and consist of interconnected nodes that process information in layers, excelling in pattern recognition tasks like image and speech recognition. Generative AI, which can create new content based on learned patterns, showcases the flexibility of algorithm substructures, producing realistic synthetic data through models like GANs (Generative Adversarial Networks).",
                group2: "The employment of an algorithm will determine its final function. While some algorithms are created to automate non-player characters (NPCs) or other game elements outside the player's control, others focus on generating content. Additionally, certain algorithms modify and control the game content to ensure a smooth and engaging experience. This versatility allows developers to enhance various aspects of the game, from character behaviors to dynamic content creation, ultimately providing a more immersive and enjoyable experience for the players.",
                group3: "Sub employment values specify the particular use case for an algorithm. These can range from controlling NPCs and managing specific sections of the game, to recognizing toxic player behavior and taking appropriate actions such as banning or imposing restrictions. By defining these sub employment values, developers can create algorithms to address various aspects of game functionality and player interactions, ensuring a more enjoyable gaming experience.",
                group4: "A task in the context of algorithms refers to the specific actions or functions an algorithm is designed to perform. For instance, algorithms can control the motion of characters or objects within a game, determining how they walk, run, or jump. Pathfinding algorithms are used to navigate complex environments, finding the best route from one point to another and avoiding obstacles along the way. Decision-making algorithms are responsible for making choices based on certain criteria, such as deciding whether a non-player character (NPC) should attack, flee, or perform another action in a given situation. Tactical and strategic planning involve higher-level thinking, where algorithms manage long-term goals and strategies. This might include short-term maneuvers in combat or broader objectives like resource management or territory control. Learning algorithms enable characters or systems to adapt and improve over time based on past experiences, allowing NPCs to become better at predicting player actions or optimizing their behaviors. Procedural content generation algorithms automatically create game content like levels, landscapes, or quests, generating varied and unique experiences for players by using randomization and patterns.",
                group5: "Requirements define the necessary structures and resources to ensure an algorithm functions correctly. This includes determining whether the algorithm can operate locally or if it requires an internet connection and external servers. Additionally, it informs about the compatibility of the algorithm with different platforms, such as PCs, consoles, mobile devices, and other hardware."
            };

            let intervals = {};
            const lastActiveImages = {}; // Store the last active image for each group

            // Function to loop through images
            function startImageLoop(groupId) {
                const images = document.querySelectorAll(`#${groupId} .image`);
                let currentIndex = 0;

                function showNextImage() {
                    images.forEach(image => (image.style.display = 'none'));
                    images[currentIndex].style.display = 'block';
                    lastActiveImages[groupId] = images[currentIndex]; // Save the last active image
                    currentIndex = (currentIndex + 1) % images.length;
                }

                showNextImage();
                return setInterval(showNextImage, 1000);
            }

            // Set the first image of each group to be visible initially
            groups.forEach(group => {
                const images = group.querySelectorAll('.image');
                if (images.length > 0) {
                    images[0].style.display = 'block';
                    lastActiveImages[group.id] = images[0];
                }
            });

            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    const groupId = button.getAttribute('data-group');

                    // Update text
                    textElement.innerHTML = `<p>${descriptions[groupId]}</p>`;

                    // Activate the corresponding image group
                    groups.forEach(group => {
                        group.classList.remove('active');
                        group.querySelectorAll('.image').forEach(image => image.classList.remove('last-active'));

                        if (group.id === groupId) {
                            group.classList.add('active');
                        } else if (lastActiveImages[group.id]) {
                            lastActiveImages[group.id].classList.add('last-active');
                        }
                    });

                    // Clear previous intervals and start new loop
                    Object.values(intervals).forEach(clearInterval);
                    intervals[groupId] = startImageLoop(groupId);
                });
            });

            // Start looping the first group by default
            buttons[0].click();
        });
    </script>
