    <style>
        .container {
            display: flex;
            justify-content: space-between;
            align-items:flex-start;
            width: 100vw;
            max-width: 1200px;
            height: 100vh;
            margin: auto;
        }
        .buttons {
            width: 35%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 0px 10px 0px 10px;
            align-items: flex-end;
        }

        .images {
            width: 30%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .image-container {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.5;
        }
        .image-container.active {
            opacity: 1;
        }
        .image {
            width: 300px;
            height: 300px;
            margin: auto;
            display: none;
            image-rendering: pixelated;
            border-radius: 10px;
            border-style: solid;
            border-color: rgba(155, 155, 155, 0.8);
        }
        .image-container .last-active {
            display: block !important;
        }

        .dynamic-text {
            width: 35%;
            padding: 0px 10px 0px 10px;
            text-align: left;
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('.buttons button');
            const textElement = document.getElementById('dynamicText');
            const groups = document.querySelectorAll('.image-container');

            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    // Remove the 'active-button' class from all buttons
                    buttons.forEach(btn => btn.classList.remove('downloadButton-active'));

                    // Add the 'active-button' class to the clicked button
                    button.classList.add('downloadButton-active');
                });
            });

            const descriptions = {
                group0: "Description for Loop Group 0.",
                group1: "Description for Loop Group 1.",
                group2: "Description for Loop Group 2.",
                group3: "Description for Loop Group 3.",
                group4: "Description for Loop Group 4.",
                group5: "Description for Loop Group 5."
            };

            let intervals = {};
            const lastActiveImages = {}; // Store the last active image for each group

            // Function to loop through images
            function startImageLoop(groupId) {
                const images = document.querySelectorAll(`#${groupId} .image`);
                let currentIndex = 0;

                function showNextImage() {
                    images.forEach(image => (image.style.display = 'none'));
                    images[currentIndex].style.display = 'block';
                    lastActiveImages[groupId] = images[currentIndex]; // Save the last active image
                    currentIndex = (currentIndex + 1) % images.length;
                }

                showNextImage();
                return setInterval(showNextImage, 1000);
            }

            // Set the first image of each group to be visible initially
            groups.forEach(group => {
                const images = group.querySelectorAll('.image');
                if (images.length > 0) {
                    images[0].style.display = 'block';
                    lastActiveImages[group.id] = images[0];
                }
            });

            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    const groupId = button.getAttribute('data-group');

                    // Update text
                    textElement.innerHTML = `<p>${descriptions[groupId]}</p>`;

                    // Activate the corresponding image group
                    groups.forEach(group => {
                        group.classList.remove('active');
                        group.querySelectorAll('.image').forEach(image => image.classList.remove('last-active'));

                        if (group.id === groupId) {
                            group.classList.add('active');
                        } else if (lastActiveImages[group.id]) {
                            lastActiveImages[group.id].classList.add('last-active');
                        }
                    });

                    // Clear previous intervals and start new loop
                    Object.values(intervals).forEach(clearInterval);
                    intervals[groupId] = startImageLoop(groupId);
                });
            });

            // Start looping the first group by default
            buttons[0].click();
        });
    </script>
